# Mise en ligne automatique : à chaque modification de la branche main,
# les tests sont lancés puis, s'ils passent, le site construit (site/) est
# publié sur main (dossier site/) et sur la branche gh-pages.
name: Tests et mise en ligne

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # GitHub Pages publie la branche main : le site construit (site/) y est
      # enregistré. Un envoi fait avec GITHUB_TOKEN ne relance pas ce workflow.
      - name: Publier (site/ sur main)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Site déjà à jour."
          else
            git commit -q -m "Mise à jour du site publié [skip ci]"
            git pull -q --rebase && git push
          fi
      # Publication aussi sur gh-pages : le site est à jour quel que soit le
      # réglage de GitHub Pages (branche main ou gh-pages).
      - name: Publier (gh-pages)
        if: github.event_name != 'pull_request'
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mise en ligne de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
